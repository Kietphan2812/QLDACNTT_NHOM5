<!DOCTYPE html>
<html lang="vi" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HRMaster Pro - Hệ Thống Quản Lý Nhân Sự Toàn Diện</title>
  
  <!-- Google Fonts & Font Awesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Chart.js for analytics visual charts -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Custom CSS Design System -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
</head>

<body>
  <!-- AUTHENTICATION OVERLAY PLACEHOLDER -->
  <div id="module-auth"></div>

  <!-- APP CONTAINER LAYOUT SHELL -->
  <div class="app-container">
    
    <!-- SIDEBAR PLACEHOLDER -->
    <div id="module-sidebar"></div>

    <!-- MAIN WORKSPACE WRAPPER -->
    <div class="main-wrapper">
      
      <!-- TOP HEADER PLACEHOLDER -->
      <div id="module-header"></div>

      <!-- MAIN CONTENT AREA (ALL VIEWS INSERTED HERE) -->
      <main class="content-area">
        <div id="module-dashboard"></div>
        <div id="module-nhanvien"></div>
        <div id="module-tuyendung"></div>
        <div id="module-luongphep"></div>
      </main>

    </div>
  </div>

  <!-- MODALS PLACEHOLDER -->
  <div id="module-modals"></div>

  <!-- SCRIPT AUTO LOAD MODULES & INIT APP -->
  <script>
    async function loadAuthAndLayoutModule() {
      const resp = await fetch('index1_auth.html');
      if (!resp.ok) throw new Error('Không thể tải index1_auth.html');
      const html = await resp.text();
      const temp = document.createElement('div');
      temp.innerHTML = html;

      const loginScreen = temp.querySelector('#login-screen');
      const sidebar = temp.querySelector('.sidebar');
      const header = temp.querySelector('.top-header');

      if (loginScreen) document.getElementById('module-auth').replaceWith(loginScreen);
      if (sidebar) document.getElementById('module-sidebar').replaceWith(sidebar);
      if (header) document.getElementById('module-header').replaceWith(header);
    }

    async function loadContentModule(id, file) {
      const resp = await fetch(file);
      if (!resp.ok) throw new Error('Không thể tải ' + file);
      const html = await resp.text();
      const placeholder = document.getElementById(id);
      if (placeholder) {
        const temp = document.createElement('div');
        temp.innerHTML = html;
        while (temp.firstChild) {
          placeholder.parentNode.insertBefore(temp.firstChild, placeholder);
        }
        placeholder.remove();
      }
    }

    async function initMasterApp() {
      try {
        await Promise.all([
          loadAuthAndLayoutModule(),
          loadContentModule('module-dashboard', 'index2_dashboard.html'),
          loadContentModule('module-nhanvien', 'index3_nhanvien.html'),
          loadContentModule('module-tuyendung', 'index4_tuyendung.html'),
          loadContentModule('module-luongphep', 'index5_luongphep.html'),
          loadContentModule('module-modals', 'index6_modals.html')
        ]);

        // Nạp JavaScript Data & Logic sau khi DOM đã được xây dựng hoàn chỉnh
        const scriptData = document.createElement('script');
        scriptData.src = 'js/data.js';
        document.body.appendChild(scriptData);

        scriptData.onload = async () => {
          if (window.db && window.db.initData) {
            await window.db.initData();
          }
          const scriptApp = document.createElement('script');
          scriptApp.src = 'js/app.js';
          document.body.appendChild(scriptApp);
        };
      } catch (err) {
        console.error('Lỗi khởi tạo ứng dụng:', err);
        document.body.innerHTML = `
          <div style="padding: 40px; font-family: sans-serif; text-align: center;">
            <h2 style="color: #e74c3c;">Lỗi Nạp Giao Diện (CORS / HTTP Server)</h2>
            <p>Vui lòng chạy file <strong>webserver.ps1</strong> và truy cập đường dẫn:</p>
            <p><a href="http://localhost:8088/" style="font-size: 20px; font-weight: bold; color: #2980b9;">http://localhost:8088/</a></p>
          </div>
        `;
      }
    }

    window.addEventListener('DOMContentLoaded', initMasterApp);
  </script>
</body>

</html>
